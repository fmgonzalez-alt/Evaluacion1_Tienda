<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Web - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Registro de Usuario</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crea tu cuenta</h2>
            <form id="registroForm" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej: Juan Pérez">
                    <span class="error" id="errorNombre"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="ejemplo@correo.cl">
                    <span class="error" id="errorEmail"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña (Mínimo 6 caracteres):</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                    <span class="error" id="errorPassword"></span>
                </div>

                <button type="submit">Registrarse</button>
                <p id="mensajeExito" class="exito"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi Tienda Web - Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
