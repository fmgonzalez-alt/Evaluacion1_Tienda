<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AnimeFigures Store</title>
    <link rel="stylesheet" href="styles.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>
</head>
<body>

    <header>
        <h1>AnimeFigures Store</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <section class="card-registro">
            <h2>Crear Cuenta</h2>
            <p>Únete a nuestra comunidad coleccionista para gestionar tus compras.</p>

            <form id="registroForm" onsubmit="return false;" autocomplete="off">
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="text" id="email" name="email" placeholder="ejemplo@gmail.com" autocomplete="off">
                    <span id="email-error" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmar Contraseña:</label>
                    <input type="password" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="telefono">Número Telefónico:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="">
                    <span id="telefono-error" class="error-text"></span>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="boletin" name="boletin" checked>
                    <label for="boletin">Deseo recibir ofertas exclusivas, novedades y lanzamientos en mi correo.</label>
                </div>

                <button type="button" id="btnRegistrar" class="btn-submit">Registrarse</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AnimeFigures Store - Todos los derechos reservados.</p>
    </footer>

    <script>
        const phoneInputField = document.querySelector("#telefono");
        const phoneInput = window.intlTelInput(phoneInputField, {
            preferredCountries: ["cl", "mx", "ar", "co", "es", "pe"],
            nationalMode: true,
            autoPlaceholder: "off", // ELIMINA CUALQUIER EJEMPLO O PLACEHOLDER
            utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js",
        });

        const emailInput = document.getElementById("email");
        const emailError = document.getElementById("email-error");
        const telefonoError = document.getElementById("telefono-error");

        // 1. Validación de Correo
        function validarCorreo() {
            const emailValue = emailInput.value.toLowerCase().trim();
            const dominiosValidos = ["@gmail.com", "@outlook.com", "@hotmail.com", "@yahoo.com", "@gmail.cl", "@outlook.cl"];

            if (emailValue === "") {
                emailError.textContent = "El correo es obligatorio.";
                emailInput.classList.add("input-invalid");
                return false;
            }

            const esValido = dominiosValidos.some(dominio => emailValue.endsWith(dominio));

            if (!esValido) {
                emailError.textContent = "Correo no válido. Debe terminar en @gmail, @outlook, @hotmail o @yahoo";
                emailInput.classList.add("input-invalid");
                return false;
            } else {
                emailError.textContent = "";
                emailInput.classList.remove("input-invalid");
                return true;
            }
        }

        // 2. Validación Estricta para CADA País (Solo Números Celulares Válidos)
        function validarTelefono() {
            const numeroLimpio = phoneInputField.value.replace(/\D/g, "");
            const paisInfo = phoneInput.getSelectedCountryData();

            if (numeroLimpio === "") {
                telefonoError.textContent = "El teléfono es obligatorio.";
                phoneInputField.classList.add("input-invalid");
                return false;
            }

            let esValido = false;
            let mensajeError = "";

            switch (paisInfo.iso2) {
                case "cl": // Chile: 9 dígitos, empieza con 9
                    esValido = /^9\d{8}$/.test(numeroLimpio);
                    mensajeError = "Chile debe tener 9 dígitos y empezar con 9.";
                    break;
                case "mx": // México: 10 dígitos, empieza con 2-9
                    esValido = /^[2-9]\d{9}$/.test(numeroLimpio);
                    mensajeError = "México debe tener 10 dígitos.";
                    break;
                case "ar": // Argentina: 10 dígitos, empieza con 9, 11, 2, 3, etc.
                    esValido = /^\d{10}$/.test(numeroLimpio);
                    mensajeError = "Argentina debe tener 10 dígitos (sin incluir el +54).";
                    break;
                case "co": // Colombia: 10 dígitos, empieza con 3
                    esValido = /^3\d{9}$/.test(numeroLimpio);
                    mensajeError = "Colombia debe tener 10 dígitos y empezar con 3.";
                    break;
                case "es": // España: 9 dígitos, empieza con 6 o 7 (móviles)
                    esValido = /^[67]\d{8}$/.test(numeroLimpio);
                    mensajeError = "España debe tener 9 dígitos y empezar con 6 o 7.";
                    break;
                case "pe": // Perú: 9 dígitos, empieza con 9
                    esValido = /^9\d{8}$/.test(numeroLimpio);
                    mensajeError = "Perú debe tener 9 dígitos y empezar con 9.";
                    break;
                default:
                    // Para el resto de los países usa la validación internacional de la librería
                    esValido = phoneInput.isValidNumber();
                    mensajeError = "Número no válido para " + paisInfo.name + ".";
                    break;
            }

            if (!esValido) {
                telefonoError.textContent = mensajeError;
                phoneInputField.classList.add("input-invalid");
                return false;
            } else {
                telefonoError.textContent = "";
                phoneInputField.classList.remove("input-invalid");
                return true;
            }
        }

        emailInput.addEventListener("input", validarCorreo);
        phoneInputField.addEventListener("input", validarTelefono);
        phoneInputField.addEventListener("countrychange", function() {
            phoneInputField.value = ""; // Limpia la caja al cambiar de bandera
            telefonoError.textContent = "";
            phoneInputField.classList.remove("input-invalid");
        });

        // Evento Final de Registro
        document.getElementById("btnRegistrar").addEventListener("click", function() {
            const nombre = document.getElementById("nombre").value.trim();
            const apellido = document.getElementById("apellido").value.trim();
            const pass1 = document.getElementById("password").value;
            const pass2 = document.getElementById("confirm_password").value;

            if (nombre === "" || apellido === "") {
                alert("Por favor completa tu Nombre y Apellido.");
                return;
            }

            const correoCorrecto = validarCorreo();
            if (!correoCorrecto) {
                emailInput.focus();
                return;
            }

            if (pass1.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres.");
                return;
            }

            if (pass1 !== pass2) {
                alert("Las contraseñas no coinciden. Por favor, verifícalas.");
                return;
            }

            const telefonoCorrecto = validarTelefono();
            if (!telefonoCorrecto) {
                phoneInputField.focus();
                return;
            }

            alert("¡Registro exitoso! Bienvenido a AnimeFigures Store.");
        });
    </script>

</body>
</html>
